name: Controles de integridad

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint (sin advertencias)
        run: npm run lint
      - name: TypeScript y tipos de rutas de Next.js
        run: npm run typecheck
      - name: Integridad de datos, imágenes y PDF
        run: npm run validate
      - name: Pruebas de regresión
        run: npm test
      - name: Build de producción
        run: npm run build
      - name: "Seguridad editorial del build Next: sin borradores en HTML, RSC ni JS públicos"
        run: npm run editorial:audit-next
      - name: Auditoría SEO del HTML, sitemap, robots y redirects
        run: npm run audit:seo
      - name: "Pages: exportación, seguridad editorial y SEO (Preview sin GA4)"
        run: npm run build:pages && node --experimental-strip-types scripts/pages/audit.mjs preview
      # Usa el Google Chrome preinstalado en ubuntu-latest: no descarga navegadores.
      - name: E2E de renderizado e interacción (escritorio y móvil)
        run: npm run test:e2e
      - name: Trazas de E2E fallidas
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
